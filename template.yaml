AWSTemplateFormatVersion: '2010-09-09'
Description: 'Onward Logistics - M1: Automated Identity Onboarding & Guardrail Architecture'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Deployment environment following Onward Logistics standards.

  OwnerName:
    Type: String
    Default: Katy Great Adonaï
    Description: Resource owner name for mandatory compliance tagging.

Resources:
  # =========================================================================
  # SECURE CREDENTIAL GENERATION
  # =========================================================================
  InitialEngineersSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'onward-${Environment}-engineers-initial-credentials'
      Description: 'Temporary initial passwords for onboarded engineering personnel.'
      GenerateSecretString:
        SecretStringTemplate: '{"username_prefix": "onward_engineer"}'
        GenerateStringKey: 'initial_password'
        PasswordLength: 18
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: onward
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerName

  # =========================================================================
  # IAM PERMISSION BOUNDARY (GUARDRAIL FOR ON-CALL ROLE)
  # =========================================================================
  OnCallPermissionBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'onward-${Environment}-oncall-boundary-${AWS::StackName}'
      Description: 'Guardrail policy that explicitly denies compute creation and termination.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowGeneralAccess
            Effect: Allow
            Action: '*'
            Resource: '*'
          - Sid: DenyComputeModification
            Effect: Deny
            Action:
              - 'ec2:RunInstances'
              - 'ec2:TerminateInstances'
            Resource: '*'

  # =========================================================================
  # IAM GROUPS & MANAGED POLICIES
  # =========================================================================
  StorageEngineerGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub 'onward-${Environment}-group-storage'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonS3FullAccess'

  ComputeAdminGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub 'onward-${Environment}-group-compute-admin'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonEC2FullAccess'

  ComputeObserverGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub 'onward-${Environment}-group-compute-observer'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess'

  # =========================================================================
  # IAM USERS
  # =========================================================================
  S3User:
    Type: AWS::IAM::User
    Properties:
      UserName: onward-s3-user
      Groups:
        - !Ref StorageEngineerGroup
      LoginProfile:
        Password: !Join 
          - ''
          - - '{{resolve:secretsmanager:'
            - !Ref InitialEngineersSecret
            - ':SecretString:initial_password}}'
            - 'Aa1!'
        PasswordResetRequired: true
      Tags:
        - Key: Project
          Value: onward
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerName

  EC2User1:
    Type: AWS::IAM::User
    Properties:
      UserName: onward-ec2-user-1
      Groups:
        - !Ref ComputeAdminGroup
      LoginProfile:
        Password: !Join 
          - ''
          - - '{{resolve:secretsmanager:'
            - !Ref InitialEngineersSecret
            - ':SecretString:initial_password}}'
            - 'Aa1!'
        PasswordResetRequired: true
      Tags:
        - Key: Project
          Value: onward
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerName

  EC2User2:
    Type: AWS::IAM::User
    Properties:
      UserName: onward-ec2-user-2
      Groups:
        - !Ref ComputeObserverGroup
      PermissionsBoundary: !Ref OnCallPermissionBoundary
      LoginProfile:
        Password: !Join 
          - ''
          - - '{{resolve:secretsmanager:'
            - !Ref InitialEngineersSecret
            - ':SecretString:initial_password}}'
            - 'Aa1!'
        PasswordResetRequired: true
      Tags:
        - Key: Project
          Value: onward
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerName

  # =========================================================================
  # CLOUDFORMATION EXECUTION ROLE & MANAGED POLICY
  # =========================================================================
  CloudFormationExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'onward-${Environment}-policy-cfn-execution-${AWS::StackName}'
      Description: 'Customer Managed Policy for CloudFormation deployment execution'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: IAMManagementPermissions
            Effect: Allow
            Action:
              - 'iam:CreateUser'
              - 'iam:DeleteUser'
              - 'iam:GetUser'
              - 'iam:UpdateUser'
              - 'iam:CreateGroup'
              - 'iam:DeleteGroup'
              - 'iam:GetGroup'
              - 'iam:AddUserToGroup'
              - 'iam:RemoveUserFromGroup'
              - 'iam:CreatePolicy'
              - 'iam:DeletePolicy'
              - 'iam:GetPolicy'
              - 'iam:GetPolicyVersion'
              - 'iam:CreatePolicyVersion'
              - 'iam:DeletePolicyVersion'
              - 'iam:AttachUserPolicy'
              - 'iam:DetachUserPolicy'
              - 'iam:AttachGroupPolicy'
              - 'iam:DetachGroupPolicy'
              - 'iam:PutUserPermissionsBoundary'
              - 'iam:DeleteUserPermissionsBoundary'
              - 'iam:CreateLoginProfile'
              - 'iam:DeleteLoginProfile'
              - 'iam:UpdateLoginProfile'
              - 'iam:TagUser'
              - 'iam:UntagUser'
              - 'iam:TagPolicy'
              - 'iam:UntagPolicy'
            Resource: '*'
          - Sid: SecretsManagerPermissions
            Effect: Allow
            Action:
              - 'secretsmanager:CreateSecret'
              - 'secretsmanager:DeleteSecret'
              - 'secretsmanager:DescribeSecret'
              - 'secretsmanager:GetSecretValue'
              - 'secretsmanager:PutSecretValue'
              - 'secretsmanager:TagResource'
              - 'secretsmanager:GetRandomPassword'
            Resource: '*'

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'onward-${Environment}-role-cfn-execution'
      Description: 'Execution role used by CloudFormation GitSync'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Ref CloudFormationExecutionPolicy
      Tags:
        - Key: Project
          Value: onward
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerName

Outputs:
  SecretARN:
    Description: 'ARN of Secrets Manager secret containing initial password'
    Value: !Ref InitialEngineersSecret

  OnCallBoundaryARN:
    Description: 'ARN of On-Call Permission Boundary Policy'
    Value: !Ref OnCallPermissionBoundary