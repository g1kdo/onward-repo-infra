AWSTemplateFormatVersion: '2010-09-09'
Description: 'Onward Logistics - M1: Automated Identity Onboarding & Guardrail Architecture'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Deployment environment following Onward Logistics standards.

  OwnerName:
    Type: String
    Default: Katy Great Adonaï
    Description: Resource owner name for mandatory compliance tagging.

Resources:
  # =========================================================================
  # SECURE CREDENTIAL GENERATION
  # =========================================================================
  InitialEngineersSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'onward-${Environment}-engineers-initial-credentials'
      Description: 'Temporary initial passwords for onboarded engineering personnel.'
      GenerateSecretString:
        SecretStringTemplate: '{"username_prefix": "onward_engineer"}'
        GenerateStringKey: 'initial_password'
        PasswordLength: 18
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: onward
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerName

  # =========================================================================
  # IAM USER(S) SELF-SERVICE PASSWORD CHANGE MANAGED POLICY
  # =========================================================================
  UserSelfServicePasswordPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: 'Allows IAM users to change their own password.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSelfPasswordChange
            Effect: Allow
            Action:
              - 'iam:ChangePassword'
              - 'iam:GetUser'
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:user/${!aws:username}'
          - Sid: AllowGetAccountPasswordPolicy
            Effect: Allow
            Action:
              - 'iam:GetAccountPasswordPolicy'
            Resource: '*'

  # =========================================================================
  # IAM PERMISSION BOUNDARY (GUARDRAIL FOR ON-CALL ROLE)
  # =========================================================================
  OnCallPermissionBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      # ManagedPolicyName is intentionally omitted to let CloudFormation auto-generate a unique ID
      # A boundary only sets the maximum permissions: anything not allowed here is implicitly denied,
      # even if the user's group grants it.
      Description: 'Guardrail policy that caps on-call engineers at compute observation and self-service password change.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowComputeObservation
            Effect: Allow
            Action:
              - 'ec2:Describe*'
              - 'elasticloadbalancing:Describe*'
              - 'autoscaling:Describe*'
              - 'cloudwatch:Describe*'
              - 'cloudwatch:GetMetricStatistics'
              - 'cloudwatch:ListMetrics'
            Resource: '*'
          - Sid: AllowSelfPasswordChange
            Effect: Allow
            Action:
              - 'iam:ChangePassword'
              - 'iam:GetUser'
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:user/${!aws:username}'
          - Sid: AllowGetAccountPasswordPolicy
            Effect: Allow
            Action:
              - 'iam:GetAccountPasswordPolicy'
            Resource: '*'

  # =========================================================================
  # IAM GROUPS & MANAGED POLICIES
  # =========================================================================
  StorageEngineerGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub 'onward-${Environment}-group-storage'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonS3FullAccess'
        - !Ref UserSelfServicePasswordPolicy

  # Single compute group: admins get its full permissions, on-call engineers are
  # narrowed to observation by the OnCallPermissionBoundary on their user.
  ComputeEngineerGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub 'onward-${Environment}-group-compute'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonEC2FullAccess'
        - !Ref UserSelfServicePasswordPolicy

  # =========================================================================
  # IAM USERS
  # =========================================================================
  # S3User:
  #   Type: AWS::IAM::User
  #   Properties:
  #     UserName: onward-s3-user
  #     Groups:
  #       - !Ref StorageEngineerGroup
  #     LoginProfile:
  #       Password: !Join 
  #         - ''
  #         - - '{{resolve:secretsmanager:'
  #           - !Ref InitialEngineersSecret
  #           - ':SecretString:initial_password}}'
  #           - 'Aa1!'
  #       PasswordResetRequired: true
  #     Tags:
  #       - Key: Project
  #         Value: onward
  #       - Key: Environment
  #         Value: !Ref Environment
  #       - Key: Owner
  #         Value: !Ref OwnerName

  EC2User1:
    Type: AWS::IAM::User
    Properties:
      UserName: onward-ec2-user-1
      Groups:
        - !Ref ComputeEngineerGroup
      LoginProfile:
        Password: !Join 
          - ''
          - - '{{resolve:secretsmanager:'
            - !Ref InitialEngineersSecret
            - ':SecretString:initial_password}}'
            - 'Aa1!'
        PasswordResetRequired: true
      Tags:
        - Key: Project
          Value: onward
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerName

  EC2User2:
    Type: AWS::IAM::User
    Properties:
      UserName: onward-ec2-user-2
      Groups:
        - !Ref ComputeEngineerGroup
      PermissionsBoundary: !Ref OnCallPermissionBoundary
      LoginProfile:
        Password: !Join 
          - ''
          - - '{{resolve:secretsmanager:'
            - !Ref InitialEngineersSecret
            - ':SecretString:initial_password}}'
            - 'Aa1!'
        PasswordResetRequired: true
      Tags:
        - Key: Project
          Value: onward
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerName

Outputs:
  SecretARN:
    Description: 'ARN of Secrets Manager secret containing initial password'
    Value: !Ref InitialEngineersSecret

  OnCallBoundaryARN:
    Description: 'ARN of On-Call Permission Boundary Policy'
    Value: !Ref OnCallPermissionBoundary