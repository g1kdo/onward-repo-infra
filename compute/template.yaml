AWSTemplateFormatVersion: '2010-09-09'
Description: 'Onward Logistics - M3 Lab 1: Auto Scaling Order System for Sales Day Demand'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Deployment environment following Onward Logistics standards.

  OwnerName:
    Type: String
    Default: Katy Great Adonaï
    Description: Resource owner name, also displayed on the order page.

  LabName:
    Type: String
    Default: Handling Sales Day Demand for the Onward Logistics Order System
    Description: Lab name displayed on the order page.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t2.micro]
    Description: Free Tier eligible instance type for every server.

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI, resolved from the AWS public SSM parameter.

  AppRepositoryUrl:
    Type: String
    Default: https://github.com/g1kdo/onward-order-app.git
    Description: Public Git repository holding the order application.

  AppVersion:
    Type: String
    Default: v1.0.0
    Description: Git tag of the order application to install. Changing it rolls out a new version.

  AppPort:
    Type: Number
    Default: 8080
    Description: Port the order application listens on.

  MinServers:
    Type: Number
    Default: 2
    Description: Servers kept running on a quiet day (one per Availability Zone).

  MaxServers:
    Type: Number
    Default: 4
    Description: Upper limit on a sales day, which caps the cost.

  TargetCpuPercent:
    Type: Number
    Default: 50
    Description: Average CPU the Auto Scaling group keeps servers at by adding or removing servers.

  VpcCidr:
    Type: String
    Default: 10.30.0.0/16
  PublicSubnetACidr:
    Type: String
    Default: 10.30.0.0/24
  PublicSubnetBCidr:
    Type: String
    Default: 10.30.1.0/24
  AppSubnetACidr:
    Type: String
    Default: 10.30.10.0/24
  AppSubnetBCidr:
    Type: String
    Default: 10.30.11.0/24

Resources:
  # =========================================================================
  # VPC & INTERNET GATEWAY
  # =========================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-compute-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-compute-igw'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # =========================================================================
  # SUBNETS (PUBLIC FOR THE LOAD BALANCER, PRIVATE FOR THE SERVERS)
  # =========================================================================
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-compute-public-a'

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-compute-public-b'

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref AppSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-compute-app-a'

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref AppSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-compute-app-b'

  # =========================================================================
  # REGIONAL NAT GATEWAY (OUTBOUND-ONLY INTERNET FOR PRIVATE SERVERS)
  # =========================================================================
  # Regional mode spans the AZs where servers run, so no public subnet or per-AZ NAT is needed.
  # Without AvailabilityZoneAddresses, AWS manages AZ coverage and Elastic IPs automatically.
  RegionalNatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: InternetGatewayAttachment
    Properties:
      AvailabilityMode: regional
      ConnectivityType: public
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-compute-nat'

  # =========================================================================
  # ROUTE TABLES
  # =========================================================================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-compute-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Private servers reach the internet only outbound, through the NAT gateway
  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-compute-app-rt'

  AppDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref RegionalNatGateway

  AppSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      RouteTableId: !Ref AppRouteTable

  AppSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetB
      RouteTableId: !Ref AppRouteTable

  # =========================================================================
  # SECURITY GROUPS (NO INBOUND SSH ANYWHERE)
  # =========================================================================
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'onward-${Environment}-compute-alb-sg'
      GroupDescription: Single public entry point for merchants and customers
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: HTTP from the internet
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: Order application on the servers only
          IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          DestinationSecurityGroupId: !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-compute-alb-sg'

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'onward-${Environment}-compute-app-sg'
      GroupDescription: Order application servers, reachable only from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: HTTPS out through the NAT gateway for updates, the app download and Systems Manager
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-compute-app-sg'

  AppIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      Description: Order application traffic from the load balancer only
      IpProtocol: tcp
      FromPort: !Ref AppPort
      ToPort: !Ref AppPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  # =========================================================================
  # SERVER IDENTITY (SESSION MANAGER AND RUN COMMAND, NO SSH KEYS)
  # =========================================================================
  AppServerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'onward-${Environment}-app-ssm-role'
      Description: 'Lets order application servers register with Systems Manager for keyless administration'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'

  AppServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub 'onward-${Environment}-app-profile'
      Roles:
        - !Ref AppServerRole

  # =========================================================================
  # LAUNCH TEMPLATE (APP INSTALLED AND STARTED AT LAUNCH)
  # =========================================================================
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub 'onward-${Environment}-app-lt'
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt AppServerInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref AppSecurityGroup
        # 1-minute CPU metrics so scaling reacts within minutes on a sales day
        Monitoring:
          Enabled: true
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: 8
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub 'onward-${Environment}-app-volume'
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            dnf install -y java-21-amazon-corretto-devel git
            useradd --system --no-create-home --shell /sbin/nologin onward
            git clone --depth 1 --branch ${AppVersion} ${AppRepositoryUrl} /opt/onward-order-app
            cat > /etc/systemd/system/onward-order-app.service <<EOF
            [Unit]
            Description=Onward Logistics order application
            After=network-online.target

            [Service]
            User=onward
            Environment="FULL_NAME=${OwnerName}"
            Environment="LAB_NAME=${LabName}"
            Environment="PORT=${AppPort}"
            ExecStart=/usr/bin/java -Xmx384m /opt/onward-order-app/OrderApp.java
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable --now onward-order-app

  # =========================================================================
  # APPLICATION LOAD BALANCER (THE ONLY PUBLIC ENTRY POINT)
  # =========================================================================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: PublicDefaultRoute
    Properties:
      Name: !Sub 'onward-${Environment}-compute-alb'
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-compute-alb'

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'onward-${Environment}-app-tg'
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: !Ref AppPort
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-app-tg'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  # =========================================================================
  # AUTO SCALING (SELF-HEALING, GROWS ON CPU, SHRINKS AFTER THE RUSH)
  # =========================================================================
  # The NAT route must exist before servers boot, or dnf and git clone have no path out
  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - AppDefaultRoute
      - AppSubnetARouteTableAssociation
      - AppSubnetBRouteTableAssociation
    Properties:
      AutoScalingGroupName: !Sub 'onward-${Environment}-app-asg'
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinServers
      MaxSize: !Ref MaxServers
      DesiredCapacity: !Ref MinServers
      VPCZoneIdentifier:
        - !Ref AppSubnetA
        - !Ref AppSubnetB
      TargetGroupARNs:
        - !Ref AppTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      DefaultInstanceWarmup: 180
      # Group metrics let operations watch capacity change in CloudWatch
      MetricsCollection:
        - Granularity: 1Minute
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-app'
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT4M

  CpuTargetTrackingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref TargetCpuPercent

Outputs:
  OrderAppUrl:
    Description: 'Single public address of the order application'
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}'

  AutoScalingGroupName:
    Description: 'Auto Scaling group, used for the scaling and self-healing demonstrations'
    Value: !Ref AppAutoScalingGroup

  TargetGroupArn:
    Description: 'Target group, used to see which servers are answering'
    Value: !Ref AppTargetGroup

  NatGatewayId:
    Description: 'Regional NAT gateway giving private servers outbound internet access'
    Value: !Ref RegionalNatGateway
